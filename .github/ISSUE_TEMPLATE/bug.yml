name: Bug
description: Signaler un comportement incorrect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Qu'est-ce qui ne fonctionne pas ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Partie concernée
      options:
        - API
        - App mobile
        - Les deux / ne sait pas
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Appareil, OS, captures d'écran, logs…
